<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creative Writing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">✦ AI Writer</div>

    <div class="nav-right">
        <button id="themeToggle">🌙</button>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
</nav>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <ul>
        <li onclick="showSection('generate')">✍ Generate</li>
        <li onclick="showSection('history')">📜 History</li>
        <li onclick="showSection('settings')">⚙ Settings</li>
    </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- GENERATE SECTION -->
    <section id="generate" class="section active">
        <h1>AI Writing Assistant</h1>

        <form method="POST" action="/generate">
            
            <textarea name="input_text" placeholder="Start writing here..."></textarea>

            <div class="controls">
                <select name="tone">
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Blogger</option>
                    <option>Poet</option>
                    <option>Professional</option>
                </select>

                <button type="submit" class="generate-btn">
                    Generate ✨
                </button>
            </div>
        </form>

        <!-- LOADER -->
        <div class="loader" id="loader"></div>

        <!-- OUTPUT -->
        <div class="output-card">
            {{ result }}
            <button class="download-btn">Download</button>
        </div>
    </section>

    <!-- HISTORY -->
    <section id="history" class="section">
        <h1>History</h1>
        <div class="history-container">
            {% for item in history %}
            <div class="history-card">
                <p>{{ item.input }}</p>
                <span>{{ item.output }}</span>
            </div>
            {% endfor %}
        </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="section">
        <h1>Settings</h1>
        <p>Theme, preferences coming soon...</p>
    </section>

</div>

<script>
function showSection(id){
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

const toggle = document.getElementById("themeToggle");

toggle.onclick = () => {
    document.body.classList.toggle("light");
};

document.querySelector("form").addEventListener("submit", () => {
    document.getElementById("loader").style.display = "block";
});
</script>

</body>
</html>
