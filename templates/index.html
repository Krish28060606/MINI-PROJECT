<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Writer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">✨ AI Writer</div>

    <div class="nav-right">
        <button id="themeToggle">🌙</button>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Dashboard</h2>
    <ul>
        <li onclick="showSection('generate')">✍ Generate</li>
        <li onclick="showSection('history')">📜 History</li>
        <li onclick="showSection('settings')">⚙ Settings</li>
    </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- GENERATE -->
    <div id="generate" class="section active">
        <h1>AI Writing Assistant</h1>

        <form method="POST" action="/generate">
            <textarea name="input_text" placeholder="Start writing here..."></textarea>

            <div class="controls">
                <select name="tone">
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Blogger</option>
                    <option>Poet</option>
                    <option>Professional</option>
                </select>

                <button type="submit" class="generate-btn">
                    Generate ✨
                </button>
            </div>
        </form>

        <div class="loader" id="loader"></div>

        {% if result %}
        <div class="output-card">
            <h3>AI Output</h3>
            <p>{{ result }}</p>
            <button class="download-btn">Download</button>
        </div>
        {% endif %}
    </div>

    <!-- HISTORY -->
    <div id="history" class="section">
        <h1>History</h1>

        <div class="history-container">
            {% for item in history %}
            <div class="history-card">
                <p><strong>Input:</strong> {{ item.input }}</p>
                <p><strong>Output:</strong> {{ item.output }}</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="section">
        <h1>Settings</h1>
        <p>Theme, preferences coming soon...</p>
    </div>

</div>

<script>
function showSection(id){
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("light");
};

document.querySelector("form").addEventListener("submit", () => {
    document.getElementById("loader").style.display = "block";
});
</script>

</body>
</html>
