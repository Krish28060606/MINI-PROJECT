<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI.CREATIVE — Ultimate AI Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0a0a1a;
    --primary:#667eea;
    --secondary:#764ba2;
    --accent:#f5a623;
    --glow:#667eea;
    --glass-bg:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.12);
    --ink:#e6f3ff;
    --muted:#a6b2c2;
}

/* Base */
*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;
    background:radial-gradient(1200px 800px at 10% -10%, rgba(96,247,255,0.10), transparent 60%),
               radial-gradient(900px 600px at 100% 110%, rgba(122,92,255,0.08), transparent 55%),
               linear-gradient(180deg,#04060b 0%, #090c16 100%);
    color:var(--ink);
    font-family:'Inter','Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* Subtle grain */
body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
    mix-blend-mode:soft-light;opacity:.35
}

/* Background orbs and grid */
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:orb-float 22s ease-in-out infinite}
.orb-1{width:520px;height:520px;background:radial-gradient(circle, rgba(102,126,234,.45), transparent 70%);top:-140px;left:-120px;animation-delay:0s}
.orb-2{width:420px;height:420px;background:radial-gradient(circle, rgba(118,75,162,.38), transparent 70%);bottom:-120px;right:-120px;animation-delay:-8s}
.orb-3{width:320px;height:320px;background:radial-gradient(circle, rgba(245,166,35,.30), transparent 70%);top:45%;left:55%;transform:translate(-50%,-50%);animation-delay:-14s;opacity:.35}
@keyframes orb-float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(28px,-26px) scale(1.05)}50%{transform:translate(-18px,18px) scale(.96)}75%{transform:translate(18px,8px) scale(1.02)}}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);background-size:46px 46px;mix-blend-mode:overlay;opacity:.25}

/* Navigation */
nav{
    position:fixed;top:0;left:0;right:0;z-index:10;
    padding:18px 7vw;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg, rgba(5,8,14,0.85), rgba(5,8,14,0.55) 60%, transparent 100%);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.06)
}
.logo{
    font-weight:900;letter-spacing:-.6px;font-size:1.5rem;
    background:conic-gradient(from 120deg at 50% 50%, var(--primary), var(--secondary), var(--accent), var(--primary));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}

/* Layout */
.hero{min-height:100svh;display:grid;place-items:center;padding:120px 20px 60px;position:relative;z-index:1}

/* Floating decor lines */
.hero::before,.hero::after{
    content:"";position:absolute;inset:auto;pointer-events:none;filter:blur(14px);opacity:.3
}
.hero::before{top:12%;left:8%;width:40vw;max-width:620px;height:2px;background:linear-gradient(90deg,transparent, var(--primary), transparent)}
.hero::after{bottom:10%;right:10%;width:36vw;max-width:560px;height:2px;background:linear-gradient(90deg,transparent, var(--accent), transparent)}

/* Card */
.auth-box{
    position:relative;isolation:isolate;
    width:100%;max-width:440px;padding:48px 42px;border-radius:22px;text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.06) 100%);
    border:1px solid var(--glass-border);
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
    transform:translateY(14px);opacity:0;animation:card-in .8s cubic-bezier(.2,.8,.2,1) .1s forwards
}
@keyframes card-in{to{opacity:1;transform:translateY(0)}}

/* Edge glow */
.auth-box::after{
    content:"";position:absolute;inset:-1px;border-radius:22px;pointer-events:none;
    background:linear-gradient(120deg, rgba(96,247,255,.25), rgba(122,92,255,.18) 45%, rgba(255,91,214,.15) 65%, transparent 80%);
    -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px
}

/* Title */
.auth-box h2{
    margin:0 0 26px;font-size:2.05rem;line-height:1.2;font-weight:800;letter-spacing:-.4px;
    background:linear-gradient(180deg,#fff 0%, #cfe8ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}

/* Inputs */
.input-group{position:relative;margin:18px 0;text-align:left}
.input-group input{
    width:100%;padding:16px 16px 16px 48px;border-radius:14px;border:1px solid var(--glass-border);
    background:linear-gradient(180deg, rgba(5,8,14,.65) 0%, rgba(5,8,14,.45) 100%);
    color:var(--ink);font-size:.98rem;font-weight:500;outline:none;transition:border .2s, box-shadow .2s, transform .2s
}
.input-group input::placeholder{color:rgba(230,243,255,.45)}
.input-group input:focus{border-color:rgba(102,126,234,.6);box-shadow:0 0 0 6px rgba(102,126,234,.12), 0 10px 34px -10px rgba(102,126,234,.28);transform:translateY(-1px)}

/* Input icons */
.input-group::before{
    content:"";position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);
    opacity:.7;filter:drop-shadow(0 0 6px rgba(96,247,255,.3))
}
.input-group:nth-of-type(1)::before{background:conic-gradient(from 90deg, var(--primary), transparent 60%) border-box;border-radius:50%}
.input-group:nth-of-type(2)::before{background:conic-gradient(from 90deg, var(--secondary), transparent 60%) border-box;border-radius:50%}
.input-group:nth-of-type(3)::before{background:conic-gradient(from 90deg, var(--accent), transparent 60%) border-box;border-radius:50%}

/* Button */
.auth-btn{
    width:100%;padding:16px 18px;margin-top:14px;border:none;border-radius:14px;cursor:pointer;
    font-weight:800;letter-spacing:.2px;color:#ffffff;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-size:220% 220%;
    transition:transform .18s ease, box-shadow .25s ease, background-position .8s ease;
    box-shadow:0 12px 30px rgba(102,126,234,.35), 0 8px 18px rgba(118,75,162,.30)
}
.auth-btn:hover{transform:translateY(-2px);background-position:100% 50%;box-shadow:0 18px 40px rgba(102,126,234,.45), 0 10px 24px rgba(118,75,162,.38)}
.auth-btn:active{transform:translateY(0)}
.auth-btn .btn-text{position:relative;z-index:1}
.auth-btn.loading .btn-text{opacity:0}
.spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#ffffff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.auth-btn.loading .spinner{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Google */
.g_id_signin{margin-top:22px !important;display:flex !important;justify-content:center}
.g_id_signin iframe{border-radius:12px !important}

/* Switch */
.switch{margin-top:24px;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);transition:background .2s, color .2s}
.switch:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.switch span{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}

/* Error */
#errorMsg{min-height:22px;margin-top:12px;font-size:.88rem;color:#ff6b7a;opacity:0;transform:translateY(-8px);transition:opacity .2s, transform .2s}
#errorMsg.show{opacity:1;transform:translateY(0)}

/* Mode-specific theming */
body[data-mode="signup"] .auth-box h2{background:linear-gradient(180deg,#fff 0%, #e6d5ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body[data-mode="signup"] .auth-btn{background:linear-gradient(135deg,#e6d5ff 0%, #b5a0e6 45%, #f5d98a 100%);color:#1a0a2e}
body[data-mode="signup"] .auth-btn:hover{box-shadow:0 18px 40px rgba(181,160,230,.35), 0 10px 24px rgba(245,217,138,.28)}
body[data-mode="signup"] .input-group input:focus{border-color:rgba(181,160,230,.65);box-shadow:0 0 0 6px rgba(181,160,230,.14), 0 10px 34px -10px rgba(181,160,230,.28)}

/* Signup background accents */
body[data-mode="signup"] .orb-1{background:radial-gradient(circle, rgba(181,160,230,.40), transparent 70%)}
body[data-mode="signup"] .orb-2{background:radial-gradient(circle, rgba(245,217,138,.34), transparent 70%)}
body[data-mode="signup"] .orb-3{background:radial-gradient(circle, rgba(245,166,35,.32), transparent 70%)}
body[data-mode="signup"] .hero::before{background:linear-gradient(90deg,transparent, #b5a0e6, transparent)}
body[data-mode="signup"] .hero::after{background:linear-gradient(90deg,transparent, #f5d98a, transparent)}

/* Responsive */
@media (max-width:480px){
  .auth-box{padding:38px 26px;margin:0 14px}
  .auth-box h2{font-size:1.7rem}
  nav{padding:14px 5vw}
  .logo{font-size:1.28rem}
}
</style>
</head>

<body>

<!-- ANIMATED BACKGROUND -->
<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
<div class="grid-overlay"></div>

<nav>
    <div class="logo">AI.CREATIVE</div>
</nav>

<div class="hero">

<div class="auth-box">

<h2 id="authTitle">Welcome Back</h2>

<div class="input-group">
    <input id="email" type="email" placeholder="Email Address">
</div>

<div class="input-group">
    <input id="mobile" type="text" placeholder="Mobile Number">
</div>

<div class="input-group">
    <input id="password" type="password" placeholder="Password">
</div>

<div id="errorMsg"></div>

<button class="auth-btn" onclick="submitAuth()">
    <span class="btn-text">Continue</span>
    <div class="spinner"></div>
</button>

<!-- GOOGLE LOGIN -->
<div id="g_id_onload"
data-client_id="293196604777-a7jgop08pdsb6pgg3k98190k7q2u747k.apps.googleusercontent.com"
data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
data-type="standard"
data-size="large"
data-theme="outline"
data-text="signin_with"
data-shape="rectangular">
</div>

<div class="switch" onclick="toggleMode()">
    <span id="switchText">Create Account</span>
</div>

</div>

</div>

<script>

let mode="login"
document.body.setAttribute("data-mode", mode)

function toggleMode(){

mode = mode==="login"?"signup":"login"
document.body.setAttribute("data-mode", mode)

document.getElementById("authTitle").innerText =
mode==="login"?"Welcome Back":"Create Account"

document.getElementById("switchText").innerText =
mode==="login"?"Create Account":"Already have an account?"

}

function submitAuth(){

let email=document.getElementById("email").value
let mobile=document.getElementById("mobile").value
let password=document.getElementById("password").value
let errorMsg=document.getElementById("errorMsg")

if(mode==="signup"){

fetch("/signup",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:"User",
email:email,
phone:mobile,
password:password
})
})

.then(res=>res.json())
.then(data=>{
alert("Signup successful! Please login.")
toggleMode()
})

}

else{

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:email,
mobile:mobile,
password:password
})
})

.then(res=>res.json())
.then(data=>{

if(data.status==="success"){
window.location.href="/index"
}
else{
errorMsg.innerText=data.message
errorMsg.classList.add("show")
setTimeout(()=>{
errorMsg.classList.remove("show")
},5000)
}

})

}

}
function handleCredentialResponse(response){

fetch("/google-login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
token:response.credential
})
})

.then(res=>res.json())

.then(data=>{

console.log("Google login response:",data)

if(data.status==="success"){

// small delay ensures session is created before redirect
setTimeout(()=>{
window.location.href="/index"
},200)

}else{

alert("Google login failed")

}

})

.catch(error=>{
console.error("Google login error:",error)
})

}

</script>

</body>
</html>
